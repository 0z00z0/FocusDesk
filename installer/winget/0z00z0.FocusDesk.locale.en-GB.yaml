ShortDescription: Holds the machine in a chosen state for a stretch of time, from the system tray.
Description: >-
  FocusDesk runs a focus session from the system tray: choose a duration, then block
  every network connection but a named allow-list, dim the screen, cover every display,
  and block the mouse and keyboard. A session ends on its own clock or from Home
  Assistant, never from the machine. The app requires administrator rights at runtime.
